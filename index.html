<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Superstar Rajinikanth Gallery</title>
  
  <style>
    :root {
      --accent: #f5b041;
      --bg-dark: #0a0a0a;
      --card-bg: #141414;
      --text: #f0f0f0;
      --speed: 0.5s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow-x: hidden;
      padding: 12px;
    }

    header {
      text-align: center;
      margin: 8px 0 12px;
      width: 100%;
    }

    h1 {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(245, 176, 65, 0.3);
    }

    p.subtitle {
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      color: #888;
      margin-top: 4px;
    }

    .slideshow-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 65dvh;
      min-height: 340px;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity var(--speed) ease-in-out, transform var(--speed) ease-out;
      opacity: 1;
      user-select: none;
    }

    .slide-img.fading {
      opacity: 0;
      transform: scale(0.98);
    }

    .badge {
      position: absolute;
      top: 14px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .counter { left: 14px; }
    .status-badge { right: 14px; color: var(--accent); }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }

    .nav-btn:hover {
      background: var(--accent);
      color: #000;
    }

    .nav-btn.prev { left: 12px; }
    .nav-btn.next { right: 12px; }

    .controls {
      display: flex;
      gap: 12px;
      margin: 14px 0 8px;
      justify-content: center;
      z-index: 10;
    }

    .action-btn {
      background: #222;
      color: #eee;
      border: 1px solid #444;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
    }

    @media (max-width: 600px) {
      .slideshow-wrapper {
        height: 60dvh;
        border-radius: 12px;
      }
      .nav-btn {
        width: 38px;
        height: 38px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Superstar Rajinikanth</h1>
    <p class="subtitle">Auto-playing photos from GitHub every 3 seconds</p>
  </header>

  <main class="slideshow-wrapper" id="slideArea">
    <div class="badge counter" id="counterDisplay">0 / 0</div>
    <div class="badge status-badge" id="statusDisplay">Loading...</div>

    <button class="nav-btn prev" id="prevBtn" aria-label="Previous image">&#10094;</button>
    <img id="mainImage" class="slide-img" src="" alt="Superstar Rajinikanth" />
    <button class="nav-btn next" id="nextBtn" aria-label="Next image">&#10095;</button>

    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </main>

  <section class="controls">
    <button class="action-btn" id="togglePlayBtn">Pause</button>
    <button class="action-btn" id="fullscreenBtn">Fullscreen</button>
  </section>

  <script>
    // =========================================================================
    // 1. GITHUB REPOSITORY CONFIGURATION
    // =========================================================================
    // Replace these values with your GitHub details:
    const GITHUB_USERNAME = "HelloKench";
    const GITHUB_REPO     = "Rajinikanth";
    const GITHUB_BRANCH   = "main";
    const GITHUB_FOLDER   = "images"; // Folder containing your 100+ images

    const INTERVAL_TIME = 3000;
    let images = [];
    let currentIndex = 0;
    let isPlaying = true;
    let timer = null;
    let progressStartTime = 0;
    let animFrame = null;

    const mainImage = document.getElementById('mainImage');
    const counterDisplay = document.getElementById('counterDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const togglePlayBtn = document.getElementById('togglePlayBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const slideArea = document.getElementById('slideArea');

    // =========================================================================
    // 2. FETCH IMAGES AUTOMATICALLY FROM GITHUB REST API
    // =========================================================================
    async function loadGitHubImages() {
      const apiURL = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${GITHUB_FOLDER}?ref=${GITHUB_BRANCH}`;

      try {
        const res = await fetch(apiURL);
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
        
        const files = await res.json();
        
        // Filter out non-image files and construct direct raw URLs
        const validExtensions = ['.jpg', '.jpeg', '.png', '.webp'];
        images = files
          .filter(file => file.type === 'file' && validExtensions.some(ext => file.name.toLowerCase().endsWith(ext)))
          .map(file => `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FOLDER}/${file.name}`);

        if (images.length === 0) {
          fallbackToSequentialNaming();
        } else {
          initSlideshow();
        }
      } catch (err) {
        console.warn("GitHub API limit reached or repo not found. Using raw CDN sequential pattern fallback.", err);
        fallbackToSequentialNaming();
      }
    }

    // Fallback: If repo is private or API hits rate limit, use sequential raw URLs
    function fallbackToSequentialNaming() {
      const TOTAL_FALLBACK = 100;
      images = Array.from({ length: TOTAL_FALLBACK }, (_, i) => 
        `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FOLDER}/rajini_${i + 1}.jpg`
      );
      initSlideshow();
    }

    function initSlideshow() {
      statusDisplay.textContent = 'Playing';
      renderSlide(currentIndex);
      startTimer();
    }

    // =========================================================================
    // 3. SLIDESHOW ENGINE & PRELOADER
    // =========================================================================
    function preloadImage(index) {
      if (!images.length) return;
      const nextIdx = (index + 1) % images.length;
      const img = new Image();
      img.src = images[nextIdx];
    }

    function renderSlide(index) {
      if (!images.length) return;
      mainImage.classList.add('fading');

      setTimeout(() => {
        mainImage.src = images[index];
        counterDisplay.textContent = `${index + 1} / ${images.length}`;
        mainImage.classList.remove('fading');
        preloadImage(index);
      }, 250);

      resetProgress();
    }

    // Skip broken images automatically
    mainImage.onerror = () => {
      console.warn(`Failed loading image at index ${currentIndex}. Skipping...`);
      nextSlide();
    };

    function nextSlide() {
      if (!images.length) return;
      currentIndex = (currentIndex + 1) % images.length;
      renderSlide(currentIndex);
    }

    function prevSlide() {
      if (!images.length) return;
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      renderSlide(currentIndex);
    }

    // =========================================================================
    // 4. TIMING & PROGRESS BAR
    // =========================================================================
    function updateProgress(timestamp) {
      if (!isPlaying) return;
      if (!progressStartTime) progressStartTime = timestamp;

      const elapsed = timestamp - progressStartTime;
      const percentage = Math.min((elapsed / INTERVAL_TIME) * 100, 100);
      progressBar.style.width = percentage + '%';

      if (elapsed < INTERVAL_TIME) {
        animFrame = requestAnimationFrame(updateProgress);
      }
    }

    function resetProgress() {
      cancelAnimationFrame(animFrame);
      progressBar.style.width = '0%';
      progressStartTime = 0;
      if (isPlaying) animFrame = requestAnimationFrame(updateProgress);
    }

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(nextSlide, INTERVAL_TIME);
      resetProgress();
    }

    function stopTimer() {
      clearInterval(timer);
      cancelAnimationFrame(animFrame);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        statusDisplay.textContent = 'Playing';
        togglePlayBtn.textContent = 'Pause';
        startTimer();
      } else {
        statusDisplay.textContent = 'Paused';
        togglePlayBtn.textContent = 'Play';
        stopTimer();
      }
    }

    // =========================================================================
    // 5. EVENT HANDLERS & TOUCH/SWIPE NAVIGATION
    // =========================================================================
    nextBtn.addEventListener('click', () => { nextSlide(); if (isPlaying) startTimer(); });
    prevBtn.addEventListener('click', () => { prevSlide(); if (isPlaying) startTimer(); });
    togglePlayBtn.addEventListener('click', togglePlay);

    let touchStartX = 0;
    let touchEndX = 0;
    slideArea.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    slideArea.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 40) {
        diff < 0 ? nextSlide() : prevSlide();
        if (isPlaying) startTimer();
      }
    }, { passive: true });

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) slideArea.requestFullscreen();
      else document.exitFullscreen();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { nextSlide(); if (isPlaying) startTimer(); }
      if (e.key === 'ArrowLeft') { prevSlide(); if (isPlaying) startTimer(); }
      if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    });

    loadGitHubImages();
  </script>
</body>
</html>
